services:
  sql:
    # Pinned tag for reproducible builds; check
    # https://mcr.microsoft.com/v2/mssql/server/tags/list for newer CUs.
    image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04
    container_name: sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in your environment or a local .env file}
    platform: "linux/amd64"
    ports:
      - "1434:1433"
