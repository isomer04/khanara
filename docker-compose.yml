services:
  db:
    # Same major version as Cloud SQL (infra/terraform/prod, var.db_version).
    image: postgres:17
    container_name: khanara-db
    environment:
      - POSTGRES_DB=khanara
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or a local .env file}
    ports:
      - "5433:5432"
    volumes:
      - khanara-pgdata:/var/lib/postgresql/data

volumes:
  khanara-pgdata:
