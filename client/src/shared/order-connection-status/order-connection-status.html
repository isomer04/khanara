@if (connectionState() === 'connecting' || connectionState() === 'reconnecting') {
  <div
    role="status"
    aria-atomic="true"
    class="mb-4 flex items-center gap-3 rounded-2xl border border-base-200 bg-base-100 px-4 py-3 shadow-sm"
  >
    <span class="loading loading-spinner loading-xs text-primary" aria-hidden="true"></span>
    <p class="text-sm text-base-content/60">
      {{ connectionState() === 'connecting' ? 'Connecting…' : 'Reconnecting…' }}
    </p>
  </div>
} @else if (connectionState() === 'failed') {
  <div
    role="status"
    aria-atomic="true"
    class="mb-4 flex flex-wrap items-center gap-3 rounded-2xl border border-base-200 bg-base-100 px-4 py-3 shadow-sm"
  >
    <span
      class="flex size-8 shrink-0 items-center justify-center rounded-full bg-warning/10 text-warning"
      aria-hidden="true"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-4"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v3.75m9.303 3.376c.866 1.5-.217 3.374-1.948 3.374H4.645c-1.73 0-2.813-1.874-1.948-3.374L10.052 3.88c.866-1.5 3.03-1.5 3.896 0l7.355 12.746ZM12 15.75h.007v.008H12v-.008Z"
        />
      </svg>
    </span>
    <p class="min-w-0 flex-1 text-sm text-base-content/70">Live updates are unavailable.</p>
    <button
      type="button"
      class="btn btn-primary btn-sm shrink-0 rounded-full px-4"
      (click)="retry()"
    >
      Retry connection
    </button>
  </div>
}
