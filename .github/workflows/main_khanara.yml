# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - khanara

# Disabled: Azure free tier expired; live site is offline. To re-enable,
# remove the `if: false` guard from the `build` job below. See README
# "Deployment" section.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Disabled while Azure free tier is expired. Set to `true` to re-enable.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install deps and build angular app
        run: |
          cd client
          npm ci
          npm run build

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: dotnet publish
        run: dotnet publish backend/Khanara.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2B1D20B9D5764DBFAB1B15B16E16EBCD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4683D0D2AAF841B9B0312A4C0FB1765D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E2CB689FF1E0498FB53B55C175C4ABC5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'khanara'
          slot-name: 'Production'
          package: .
          # Wipe wwwroot before extracting — stale files from earlier
          # solution-level deploys (e.g. Khanara.API.Tests.runtimeconfig.json)
          # break App Service's startup-DLL detection.
          clean: true
          restart: true
          startup-command: 'dotnet Khanara.API.dll'